services:
  - type: web
    name: graphguard-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_GRAPH
        value: GraphGuardDemo
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_TLS
        value: "true"
      - key: GRAPHGUARD_ENABLE_DISCOVERY
        value: "false"
      - key: GRAPHGUARD_ALLOW_LIVE_ENRICHMENT
        value: "false"
      - key: GRAPHGUARD_ENABLE_AUDIT_API
        value: "false"
